      "bio": "Hello!  I'm Jen, founder and owner of Areté. My path here started in 2015 after I broke my ankle and spent months in a walking boot and on crutches. The aftermath was intense sciatica, the kind of pain that could nearly drop me to my knees. My now-husband, Nathan, suggested I try floating for relief. At first, I thought he was out of his mind. Eventually I booked a session anyway, mostly because I figured it could not make things worse! After my first float, the relief I felt was honestly magical. I was instantly hooked. At the time, the closest float studio was more than an hour east of Carrboro. I could not believe there wasn't one closer to home, so bringing a float studio to my hometown became the next step. After two years of development, fundraising, and build-out, Areté came to life in February 2018. I could not be more proud to share this little world of wellness with you.\n\nCome by to check out the space we have created, book a sesh, or just say \"hello\"!",
