  <script type="application/ld+json">
  {

    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is a cold plunge?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A cold plunge is a tub of cold water used for short, intentional cold-water immersion. It is sometimes called an ice bath, though a cold plunge is usually cleaner, more controlled, and easier to repeat as a wellness ritual."
        }
      },
      {
        "@type": "Question",
        "name": "What are the benefits of cold plunge therapy?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Cold plunge therapy may support recovery, circulation, resilience, stress management, alertness, and post-exercise soreness. It is commonly used for athletic recovery and wellness recovery routines."
        }
      },
      {
        "@type": "Question",
        "name": "How long should I stay in a cold plunge?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Many beginners start with 30 to 90 seconds and build slowly. Experienced guests may work toward two to three minutes. The right amount depends on your body, health history, and comfort level."
        }
      },
      {
        "@type": "Question",
        "name": "What is contrast therapy?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Contrast therapy alternates heat and cold, such as infrared sauna and cold plunge, to create a controlled hot-cold cycle that supports circulation, recovery, and nervous system resilience."
        }
      },
      {
        "@type": "Question",
        "name": "Why combine sauna and cold plunge?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Combining sauna and cold plunge gives the body a clear contrast between heat and cold. The infrared sauna warms the body and encourages circulation; the cold plunge brings a focused cooling response."
        }
      },
      {
        "@type": "Question",
        "name": "Is cold plunge therapy safe?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Cold plunge therapy is well tolerated by many healthy adults, but it is not right for everyone. People who are pregnant, have heart conditions, blood pressure concerns, or other medical conditions should check with a clinician first."
        }
      },
      {
        "@type": "Question",
        "name": "Is cold plunge therapy good after exercise?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Cold plunge therapy is often used after exercise to support athletic recovery, soreness management, and a calmer post-workout state. Some athletes prefer it after hard training days rather than immediately before strength sessions."
        }
      },
      {
        "@type": "Question",
        "name": "How often should I do cold plunge therapy?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Many people start once a week and build from there. Regular guests often use cold plunge or contrast therapy one to three times weekly, depending on recovery needs, training load, and how their body responds."
        }
      }
    ]
  }
  </script>
