<body class="rs-page">
  <div id="root"></div>
  <script>
    // If this page was built while the offer was on, but the offer has now
    // ended, hide the old offer until reset.jsx shows the "ended" version.
    // Keep this date equal to endsAt in reset-campaign.jsx (a test checks).
    (function () {
      var ENDS_AT = "2027-02-01T00:00:00-05:00";
      if (Date.now() < Date.parse(ENDS_AT)) return;
      if (!document.querySelector("#root .rs-ticket:not(.rs-ticket--ended)")) return;
      var html = document.documentElement;
      html.classList.add("rs-ended-pending");
      setTimeout(function () { html.classList.remove("rs-ended-pending"); }, 3000);
    })();
  </script>
  <script type="text/babel" src="reset-campaign.jsx"></script>
