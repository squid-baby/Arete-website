  <!--
    =====================================================================
    HOW TO UPDATE THE FAQ
    =====================================================================
    Edit the JSON below. The page renders from this list AND the
    FAQPage JSON-LD schema is generated from the same data, so Google
    always sees the same answers visitors see.

    Each group has: { id, title, items: [ { q, a } ] }
    "a" supports basic <a href> markup but keep answers plain-text
    where possible. Schema requires text-only.
    =====================================================================
  -->
  <script type="application/json" id="faq-data">
  [
    {
      "id": "floating",
      "title": "Floating",
      "items": [
        {
          "q": "What does floating actually feel like?",
          "a": "You lie back in roughly ten inches of skin-temperature water saturated with 1,000 lbs of Epsom salt. The salt makes you completely buoyant, your body floats effortlessly on the surface, ears submerged, with the option to keep the lights on or turn them off entirely. Most people describe the first 10–15 minutes as adjustment, then a deep, almost dreamlike calm settles in. It is not like a swimming pool. It is closer to gravity-free meditation."
        },
        {
          "q": "Is it safe? Can I drown?",
          "a": "Floating is extremely safe. The salt content is so high that you cannot sink, even if you fell asleep (which many guests do), you would simply float on. The water is only ten inches deep. The room is fully private and lockable, but staff are always nearby."
        },
        {
          "q": "What should I bring? What should I wear?",
          "a": "Just yourself. We provide towels, earplugs, body wash, conditioner, blow dryer, and Q-tips. Most guests float nude, the room is fully private, but a swimsuit is welcome if you prefer."
        },
        {
          "q": "Can I float if I'm pregnant, claustrophobic, or have a medical condition?",
          "a": "Floating is generally excellent during the second and third trimesters of pregnancy, the gravity relief is meaningful, but please get clearance from your OB first. The float room is large and the door is unlocked from inside, so most guests with mild claustrophobia are comfortable. If you have open wounds, dyed hair within the last week, contagious skin conditions, or uncontrolled epilepsy, please reschedule. When in doubt, call us at 919-636-9899."
        }
      ]
    },
    {
      "id": "sauna",
      "title": "Sauna & Heat",
      "items": [
        {
          "q": "What's the difference between infrared and traditional sauna?",
          "a": "Traditional saunas heat the air around you, typically 180–200°F. Our infrared saunas heat your body directly with light wavelengths at a more comfortable 130–155°F. The result is a deeper, lower-stress sweat that most people find easier to tolerate for a full 30-minute session. It also pairs beautifully with cold plunge for contrast therapy."
        },
        {
          "q": "How often should I sauna?",
          "a": "The research on cardiovascular and longevity benefits clusters around 3–4 sessions per week. Once a week is still meaningful, and daily sessions are fine for most healthy adults. Sessions are up to 30 minutes; if you're new, start with 15 minutes and build up gradually."
        },
        {
          "q": "Should I drink water before or after?",
          "a": "Both. Hydrate well in the hour before and replenish afterward. Complimentary filtered water is available, and electrolyte packets are available for purchase. Avoid alcohol before sauna; it dehydrates you and blunts the benefits."
        }
      ]
    },
    {
      "id": "contrast",
      "title": "Contrast Therapy",
      "items": [
        {
          "q": "How cold is the cold plunge?",
          "a": "Our cold plunge is held around 51°F. A common rhythm is 10–15 minutes in the sauna followed by 1–3 minutes in the plunge, repeated 2–3 times. We give every guest a full orientation and review timing in more detail at the time of the appointment, so you will know exactly what to expect before you begin."
        },
        {
          "q": "Is cold plunging safe for everyone?",
          "a": "Cold immersion is intense and not for everyone. If you have heart conditions, uncontrolled high blood pressure, are pregnant, or have Raynaud's, please skip the plunge or check with your physician first. Always enter slowly, control your breathing, and exit when you feel ready, never push past genuine discomfort."
        },
        {
          "q": "How long should I stay in?",
          "a": "60 seconds to 3 minutes per round is plenty. The benefits plateau quickly; longer is not better. If you can hold steady, controlled breathing for the full minute, you have done the work."
        }
      ]
    },
    {
      "id": "massage",
      "title": "Massage",
      "items": [
        {
          "q": "What kinds of massage do you offer?",
          "a": "Our therapists specialize in therapeutic massage and can also offer gentle relaxation. Every massage is customized to what you and your body need that day, based on the goals and preferences you discuss with your practitioner."
        }
      ]
    },
    {
      "id": "visiting",
      "title": "Booking & Visiting",
      "items": [
        {
          "q": "How early should I arrive?",
          "a": "Please arrive 5–10 minutes before your appointment. Ten minutes is plenty, even for your first visit; there is no need to arrive earlier."
        },
        {
          "q": "What's your cancellation policy?",
          "a": "Appointments can be rescheduled or cancelled at least 24 hours in advance with no charge. A massage cancelled within 24 hours is charged in full. All other services cancelled within 24 hours incur a $25 late-cancellation fee. Memberships have their own terms; please see the membership page."
        },
        {
          "q": "Can I combine services, and does the order matter?",
          "a": "Services can be enjoyed in any order. Many guests like to sauna before massage because the heat warms the muscles and fascia, which can complement the bodywork. We generally suggest enjoying contrast therapy on a different day because it tends to feel very energizing, while float, sauna, massage, red light, and halotherapy tend to feel calming. There is no reason you cannot combine contrast with another service on the same day; simply consider how you want to feel when you leave the studio."
        },
        {
          "q": "Will orientation or changing time shorten my service?",
          "a": "No. The service length you book is the full amount of service time you receive. Orientations, walkthroughs, and changing time do not cut into it. We reserve a longer appointment block around each service so you can enjoy every booked minute without feeling rushed."
        },
        {
          "q": "Can I bring someone who is not receiving a service?",
          "a": "To preserve our limited space and the peaceful atmosphere for guests with appointments, please avoid bringing companions who are not receiving a service unless you need someone with you for accessibility or support. While in the studio, please keep phones silent and voices low. Areté is a space for quiet reflection, and we even encourage leaving your phone at home when you can."
        },
        {
          "q": "Do you offer memberships, packages, or gift cards?",
          "a": "Yes to all three. Memberships include monthly sessions plus member-only pricing on add-ons; packages bundle 5 or 10 visits at a discount. Gift cards in any amount are available at the front desk or online. Visit our memberships page for current pricing."
        },
        {
          "q": "Where are you, and where do I park?",
          "a": "We're at 213 E. Braxton Foushee Street in Carrboro, NC. Please use one of our two parking lots rather than street parking: the paved lot on E. Braxton Foushee Street, or the gravel lot off Maple Ave. Ext. For the gravel lot, drive all the way in and use the spaces marked with Reserved signs."
        }
      ]
    }
  ]
